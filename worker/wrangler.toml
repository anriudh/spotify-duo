name = "spotify-duo"
main = "src/index.ts"
compatibility_date = "2026-09-17"

# Client ID is not a secret (it is public in the OAuth flow).
# The client SECRET is never set here -- see: wrangler secret put SPOTIFY_CLIENT_SECRET
[vars]
SPOTIFY_CLIENT_ID = "45adb9a82f14417b9e7b1481265bb2b0"

[[d1_databases]]
binding = "DB"
database_name = "spotify-duo"
database_id = "REPLACE_WITH_ID_FROM_D1_CREATE"

[triggers]
crons = ["* * * * *"]
